{% extends 'base.html' %}
{% block title %}Login admin{% endblock %}
{% block content %}
<div class="container">
  <div class="card auth-card p-4">
    <div class="card-body">
      <h4 class="fw-bold mb-1"><i class="bi bi-shield-lock-fill text-primary"></i> Login admin</h4>
      <p class="text-muted small mb-4">Khusus untuk pengelola sistem TargetKu.</p>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Masuk sebagai admin</button>
      </form>
      <p class="text-center small mt-3 mb-0">
        <a href="{{ url_for('login') }}" class="text-muted"><i class="bi bi-arrow-left"></i> Kembali ke login pengguna</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
