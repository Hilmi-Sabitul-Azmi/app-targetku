{% extends 'base.html' %}
{% block title %}Ganti password admin{% endblock %}
{% block content %}
<div class="container">
  <div class="card auth-card p-4">
    <div class="card-body">
      <h4 class="fw-bold mb-1"><i class="bi bi-key-fill text-primary"></i> Ganti password admin</h4>
      <p class="text-muted small mb-4">Disarankan segera diganti dari password default sebelum aplikasi dipakai publik.</p>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Password lama</label>
          <input type="password" name="password_lama" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password baru</label>
          <input type="password" name="password_baru" class="form-control" minlength="6" required>
          <div class="form-text">Minimal 6 karakter.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Konfirmasi password baru</label>
          <input type="password" name="konfirmasi_password" class="form-control" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Simpan password baru</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-link w-100 text-muted mt-1">Batal</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
